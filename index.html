    <script>
      // Gracefully prevent cross-origin iframe security exceptions from bubbling as uncaught errors
      window.addEventListener('error', function(event) {
        if (event && event.message && (
          event.message.indexOf('cross-origin frame') !== -1 ||
          event.message.indexOf('Blocked a frame') !== -1 ||
          event.message.indexOf('SecurityError') !== -1
        )) {
          event.preventDefault();
          if (typeof event.stopImmediatePropagation === 'function') {
            event.stopImmediatePropagation();
          }
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = '' + (event && event.reason ? event.reason : '');
        if (
          reason.indexOf('cross-origin frame') !== -1 ||
          reason.indexOf('Blocked a frame') !== -1 ||
          reason.indexOf('SecurityError') !== -1
        ) {
          event.preventDefault();
          if (typeof event.stopImmediatePropagation === 'function') {
            event.stopImmediatePropagation();
          }
        }
      }, true);
    </script>
